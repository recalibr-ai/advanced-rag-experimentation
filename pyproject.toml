[project]
name = "advanced-rag-experimentation"
version = "0.1.0"
description = "Advanced RAG techniques demo: Late Interaction, Multiple Representations, and Reasoning Retrievers"
authors = [
    { name = "AI Tinkerer", email = "your-email@example.com" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    # Core ML libraries
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "sentence-transformers>=2.2.2",
    
    # Late interaction models
    "pylate>=0.1.0",
    
    # Alternative ColBERT library 
    "ragatouille>=0.0.8",
    
    # Data handling
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    
    # Visualization
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "plotly>=5.17.0",
    
    # Jupyter notebook support
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.0.0",
    
    # Evaluation metrics
    "scikit-learn>=1.3.0",
    "ranx>=0.3.0",
    
    # Text processing
    "nltk>=3.8.0",
    "spacy>=3.7.0",
    
    # Vector databases (optional)
    "faiss-cpu>=1.7.4",
    "chromadb>=0.4.0",
    "pinecone-client>=2.2.0",
    
    # Progress bars and utilities
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
gpu = [
    "faiss-gpu>=1.7.4",
    "torch[cuda]",
]

dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.0.287",
    "pre-commit>=3.4.0",
]

demo = [
    # Additional packages for demo presentation
    "gradio>=4.0.0",
    "streamlit>=1.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM", "EXE", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = ["S101", "S301", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"